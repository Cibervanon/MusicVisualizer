name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.12'

jobs:
  # Frontend linting and type checking
  frontend-lint:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Type check
        run: npx tsc --noEmit
        working-directory: frontend

  # Frontend tests
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Test
        run: npm test
        working-directory: frontend

  # Frontend build
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # Backend linting and type checking
  backend-lint:
    name: Backend Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          pip install -r requirements.txt
        working-directory: backend

      - name: Lint (ruff)
        run: ruff check .
        working-directory: backend

      - name: Type check (mypy)
        run: mypy app/
        working-directory: backend

  # Backend tests
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: backend

      - name: Test
        run: python -m unittest discover -s tests -v
        working-directory: backend

  # Security audit
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend security audit
        run: npm audit --audit-level=high
        working-directory: frontend
        continue-on-error: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Backend security audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --fail-only
        working-directory: backend
        continue-on-error: false

  # Bundle size check
  bundle-size:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    needs: [frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Check bundle size
        run: |
          npx vite-bundle-analyzer dist --json > bundle-report.json
          echo "Bundle report generated"
          # Check JS bundle size (should be < 400KB gzipped)
          MAX_JS_SIZE=400000
          MAX_CSS_SIZE=50000
          
          JS_SIZE=$(ls -la dist/assets/*.js | awk '{sum += $5} END {print sum}')
          CSS_SIZE=$(ls -la dist/assets/*.css | awk '{sum += $5} END {print sum}')
          
          echo "JS total: $JS_SIZE bytes"
          echo "CSS total: $CSS_SIZE bytes"
          
          if [ "$JS_SIZE" -gt "$MAX_JS_SIZE" ]; then
            echo "❌ JS bundle too large: $JS_SIZE > $MAX_JS_SIZE"
            exit 1
          fi
          
          if [ "$CSS_SIZE" -gt "$MAX_CSS_SIZE" ]; then
            echo "❌ CSS bundle too large: $CSS_SIZE > $MAX_CSS_SIZE"
            exit 1
          fi
          
          echo "✅ Bundle sizes within budget"
        working-directory: frontend

  # Render time budget (backend)
  render-budget:
    name: Render Time Budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: backend

      - name: Skip render time check (requires media files)
        run: |
          echo "⏭️ Skipping render time check (requires test media files)"
          echo "This check should run in a separate integration test environment with test media"
        working-directory: backend
        continue-on-error: false

  # Summary
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [
      frontend-lint, frontend-test, frontend-build,
      backend-lint, backend-test,
      security-audit, bundle-size, render-budget
    ]
    if: always()
    steps:
      - name: Check job statuses
        run: |
          echo "=== CI Summary ==="
          echo "Frontend Lint: ${{ needs.frontend-lint.result }}"
          echo "Frontend Test: ${{ needs.frontend-test.result }}"
          echo "Frontend Build: ${{ needs.frontend-build.result }}"
          echo "Backend Lint: ${{ needs.backend-lint.result }}"
          echo "Backend Test: ${{ needs.backend-test.result }}"
          echo "Security Audit: ${{ needs.security-audit.result }}"
          echo "Bundle Size: ${{ needs.bundle-size.result }}"
          echo "Render Budget: ${{ needs.render-budget.result }}"
          
          if [[ "${{ needs.frontend-lint.result }}" != "success" ]] || \
             [[ "${{ needs.frontend-test.result }}" != "success" ]] || \
             [[ "${{ needs.frontend-build.result }}" != "success" ]] || \
             [[ "${{ needs.backend-lint.result }}" != "success" ]] || \
             [[ "${{ needs.backend-test.result }}" != "success" ]] || \
             [[ "${{ needs.security-audit.result }}" != "success" ]] || \
             [[ "${{ needs.bundle-size.result }}" != "success" ]]; then
            echo "❌ Some checks failed"
            exit 1
          fi
          
          echo "✅ All checks passed"