name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.12'

jobs:
  # Frontend linting and type checking
  frontend-lint:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Type check
        run: npx tsc --noEmit
        working-directory: frontend

  # Frontend tests
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Test
        run: npm test
        working-directory: frontend

  # Frontend build
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # Backend linting and type checking
  backend-lint:
    name: Backend Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: backend

      - name: Lint (ruff)
        run: python -m ruff check .
        working-directory: backend

      - name: Type check (mypy)
        run: python -m mypy app/
        working-directory: backend

  # Backend tests (includes the real FFmpeg render integration test)
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: backend

      - name: Check FFmpeg
        run: ffmpeg -version && ffprobe -version

      - name: Test
        run: python -m unittest discover -s tests -v
        working-directory: backend

  # Security audit
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend security audit
        run: npm audit --audit-level=high
        working-directory: frontend

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Backend security audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
        working-directory: backend

  # Bundle size budget, measured gzipped (what the browser actually downloads)
  bundle-size:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    needs: [frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Check bundle size
        run: |
          set -euo pipefail
          JS_GZIP=$(find dist/assets -name '*.js' -print0 | xargs -0 cat | gzip -9 | wc -c)
          CSS_GZIP=$(find dist/assets -name '*.css' -print0 | xargs -0 cat | gzip -9 | wc -c)
          MAX_JS_GZIP=180000
          MAX_CSS_GZIP=20000

          echo "JS gzip total:  ${JS_GZIP} bytes (budget ${MAX_JS_GZIP})"
          echo "CSS gzip total: ${CSS_GZIP} bytes (budget ${MAX_CSS_GZIP})"

          if [ "$JS_GZIP" -gt "$MAX_JS_GZIP" ]; then
            echo "JS bundle too large: ${JS_GZIP} > ${MAX_JS_GZIP}"
            exit 1
          fi
          if [ "$CSS_GZIP" -gt "$MAX_CSS_GZIP" ]; then
            echo "CSS bundle too large: ${CSS_GZIP} > ${MAX_CSS_GZIP}"
            exit 1
          fi
          echo "Bundle sizes within budget"
        working-directory: frontend

  # Summary
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [
      frontend-lint, frontend-test, frontend-build,
      backend-lint, backend-test,
      security-audit, bundle-size
    ]
    if: always()
    steps:
      - name: Check job statuses
        run: |
          echo "=== CI Summary ==="
          echo "Frontend Lint: ${{ needs.frontend-lint.result }}"
          echo "Frontend Test: ${{ needs.frontend-test.result }}"
          echo "Frontend Build: ${{ needs.frontend-build.result }}"
          echo "Backend Lint: ${{ needs.backend-lint.result }}"
          echo "Backend Test: ${{ needs.backend-test.result }}"
          echo "Security Audit: ${{ needs.security-audit.result }}"
          echo "Bundle Size: ${{ needs.bundle-size.result }}"

          if [[ "${{ needs.frontend-lint.result }}" != "success" ]] || \
             [[ "${{ needs.frontend-test.result }}" != "success" ]] || \
             [[ "${{ needs.frontend-build.result }}" != "success" ]] || \
             [[ "${{ needs.backend-lint.result }}" != "success" ]] || \
             [[ "${{ needs.backend-test.result }}" != "success" ]] || \
             [[ "${{ needs.security-audit.result }}" != "success" ]] || \
             [[ "${{ needs.bundle-size.result }}" != "success" ]]; then
            echo "Some checks failed"
            exit 1
          fi

          echo "All checks passed"
